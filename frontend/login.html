<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tegora | Log in</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
  <link href="css/login.css" rel="stylesheet">

</head>

<body>
  <main class="page-container">
    <section class="brand-container"></section>
    <section class="login-form-container">
      <div class="signup-text">
        <p class="">Don't have an account?</p>
        <a href="signup.html">Sign up</a>
      </div>

      <h2>Welcome back!</h2>
      <p class="join-text">Log in to your Tegora account and take <br> control of your finances.</p>

      <div class="form-group">
        <label for="email">Email address</label>
        <div class="input-wrapper">
          <span class="material-symbols-outlined">
            mail
          </span>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
      </div>

      <div class="form-group">
        <label class="password-label">Password</label>
        <div class="input-wrapper">
          <span class="material-symbols-outlined">
            lock
          </span>
          <input type="password" id="password" name="password" placeholder="Enter your password"
            autocomplete="new-password" required>
          <button type="button" aria-label="Show password" aria-controls="password" class="visibility-button">
            <span class="material-symbols-outlined">
              visibility_off
            </span>
          </button>
        </div>
      </div>


      <div class="remember-me">
        <input type="checkbox" id="terms" name="terms" required>

        <label for="remember-me">
          Remember me
        </label>

        <a href="#">Forgot password?</a>
      </div>

      <button class="login-btn">
        Log in
        <span class="material-symbols-outlined">
          arrow_right_alt
        </span>
      </button>

      <div class="alt-login-line">
        <span class="thin-line"></span>
        <span class="divider-text">or continue with</span>
        <span class="thin-line"></span>
      </div>

      <div class="alt-login-container">
        <button class="social-btn google">
          <img src="assets/images/google-logo2-removebg-preview.png" class="google-logo">
          Log in with Google
        </button>
        <button class="social-btn apple">
          <img src="assets/images/apple-logo-transparent-removebg-preview.png" class="apple-logo">
          Log in with Apple
        </button>
      </div>




    </section>
  </main>
</body>

</html>
