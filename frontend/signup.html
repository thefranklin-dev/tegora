<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tegora | Create Account</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
  <link href="css/signup.css" rel="stylesheet">

</head>

<body>
  <main class="page-container">
    <section class="brand-container"></section>
    <section class="signup-form-container">
      <div class="login-text">
        <p class="">Already have an account?</p>
        <a href="login.html">Log in</a>
      </div>

      <h2>Create your Tegora account</h2>
      <p class="join-text">Join thousands of users already enjoying a simpler, <br> smarter financial life.</p>
      <div class="name-container">

        <div class="form-group">
          <label for="first-name">First name</label>

          <div class="input-wrapper">
            <input type="text" id="first-name" name="firstName" placeholder="Enter first name" autocomplete="given-name"
              required>
          </div>
        </div>

        <div class="form-group">
          <label for="last-name">Last name</label>
          <div class="input-wrapper">
            <input type="text" id="last-name" name="lastName" placeholder="Enter last name" autocomplete="family-name"
              required>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email address</label>
        <div class="input-wrapper">
          <span class="material-symbols-outlined">
            mail
          </span>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
      </div>


      <div class="form-group">
        <label for="phone">Phone number</label>
        <div class="input-wrapper phone-wrapper">
          <button type="button" class="country">
            <img src="assets/images/Flag_of_Nigeria.svg.webp" alt="" class="nigeria-flag">
            <span>+234</span>
            <span class="material-symbols-outlined">
              keyboard_arrow_down
            </span>
          </button>
          <input type="tel" id="phone" name="phone" placeholder="801 234 5678" autocomplete="tel-national"
            inputmode="numeric" required>
        </div>
      </div>

      <div class="form-group">
        <label class="password-label">Password</label>
        <div class="input-wrapper">
          <span class="material-symbols-outlined">
            lock
          </span>
          <input type="password" id="password" name="password" placeholder="Create a strong password"
            autocomplete="new-password" required>
          <button type="button" aria-label="Show password" aria-controls="password" class="visibility-button">
            <span class="material-symbols-outlined">
              visibility_off
            </span>
          </button>
        </div>
      </div>


      <div class="form-group">
        <label class="password-label">Confirm Password</label>
        <div class="input-wrapper">
          <span class="material-symbols-outlined">
            lock
          </span>
          <input type="password" id="password" name="password" placeholder="Create a strong password"
            autocomplete="new-password" required>
          <button type="button" aria-label="Show password" aria-controls="password" class="visibility-button">
            <span class="material-symbols-outlined">
              visibility_off
            </span>
          </button>
        </div>
      </div>


      <div class="terms">
        <input type="checkbox" id="terms" name="terms" required>

        <label for="terms">
          I agree to Tegora's
          <a href="#">Terms of Service</a>
          and
          <a href="#">Privacy Policy</a>.
        </label>
      </div>

      <button class="signup-btn">
        Create My Account
        <span class="material-symbols-outlined">
          arrow_right_alt
        </span>
      </button>

      <div class="alt-signup-line">
        <span class="thin-line"></span>
        <span class="divider-text">or continue with</span>
        <span class="thin-line"></span>
      </div>

      <div class="alt-signup-container">
        <button class="social-btn google">
          <img src="assets/images/google-logo2-removebg-preview.png" class="google-logo">
          Sign up with Google
        </button>
        <button class="social-btn apple">
          <img src="assets/images/apple-logo-transparent-removebg-preview.png" class="apple-logo">
          Sign up with Apple
        </button>
      </div>




    </section>
  </main>
</body>

</html>
