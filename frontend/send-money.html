<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tegora | Send Money</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
  <link href="css/style.css" rel="stylesheet">

</head>

<body>
  <main class="dashboard">
    <aside class="side-bar">
      <div class="logo-container">
        <img src="assets/images/tegora-T-Logo.png" alt="Tegora Logo" class="logo">
        <h3>Tegora</h3>
      </div>

      <menu class="side-menu-container">
        <a class="side-menu">
          <span class="material-symbols-outlined">
            home
          </span>
          <small>Dashboard</small>
        </a>
        <a class="side-menu">
          <span class="material-symbols-outlined">send</span>
          <small>Send Money</small>
        </a>
        <a class="side-menu">
          <span class="material-symbols-outlined">download</span>
          <small>Receive Money</small>
        </a>
        <a class="side-menu">
          <span class="material-symbols-outlined">smartphone</span>
          <small>Airtime & Data</small>
        </a>
        <a class="side-menu">
          <span class="material-symbols-outlined">receipt_long</span>
          <small>Pay Bills</small>
        </a>
        <a class="side-menu">
          <span class="material-symbols-outlined">history</span>
          <small>Transactions</small>
        </a>
        <a class="side-menu">
          <span class="material-symbols-outlined">credit_card</span>
          <small>Cards</small>
        </a>
        <a class="side-menu">
          <span class="material-symbols-outlined">person</span>
          <small>Profile</small>
        </a>
        <a class="side-menu">
          <span class="material-symbols-outlined">settings</span>
          <small>Settings</small>
        </a>
      </menu>
    </aside>


    <section class="page">
      <div class="dashboard-details">
        <div class="header-container">
          <div class="left-side">
            <h3>Good Morning, SHANIQUA</h3>
            <p>Send money to anyone, anywhere and anytime.</p>
          </div>
          <div class="right-side">
            <div class="search-bar">
              <span class="material-symbols-outlined">search</span>
              <input type="search" placeholder="Search for people, bills or services...">
            </div>
            <span class="material-symbols-outlined">notifications</span>
          </div>
        </div>


    </section>

  </main>

</body>

</html>
